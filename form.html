<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Juliette Phemba">
    <meta name="description" content="week5 assignment to be submitted by Sunday, it is about product review">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <fieldset>
                <label class="required"> Product Review*</label>
                    <select name="review" id="review" required>
                    <option value="" disabled> Select a Product</option>
                    </select>
                
                <div>
                    <div class="rating required">Overall Rating*</div>
                    <div class="stars">
                        <input type="radio" id="star-a" name="star-a" value="1" required><label for="star-a"></label>
                        <input type="radio" id="star-b" name="star-b" value="2" required><label for="star-b"></label>
                        <input type="radio" id="star-c" name="star-c" value="3" required><label for="star-c"></label>
                        <input type="radio" id="star-d" name="star-e" value="4" required><label for="star-d"></label>
                        <input type="radio" id="star-e" name="star-d" value="5" required><label for="star-e"></label>


                    </div>
                </div>



                <label class="required"> Date of intallation*</label>
                <input type="date" id="date" name="date" required>

                <div>
                    <div class="required"> Which features did you find useful in the product?*</div>
                    <div class="check">Check all that apply</div>
                </div>
                <label for=""><input type="checkbox" name="durability" value="yes"> Durability</label>
                <label for=""><input type="checkbox" name="checkbox" value="yes"> Ease of Use</label>
                <label for=""><input type="checkbox" name="checkbox" value="yes"> Performance</label>
                <label for=""><input type="checkbox" name="design" value="yes"> Design</label>


                <label for="">Written Review <label class="optional">(optional)</label> </label>
                
                <input type="textarea" name="written" id="written">

                <label for="">Your Name <label class="optional">(optional)</label></label>
                <input type="text" name="name" id="name">
            </fieldset>
            <fieldset><input type="submit" value="Post Review"></fieldset>
        </form>
    </main>
    <footer>
        <p>☘️© <span id="currentyear"></span> Juliette Phemba DR Congo☘️</p>
        <p id="lastmodified"> Last modification</p>
    </footer>

</body>

</html>
