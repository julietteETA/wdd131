<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Juliette Phemba">
    <meta name="description" content="week5 assignment to be submitted by Sunday, it is about product review">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-medium.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <fieldset>
                <label for="review" class="required"> Product Review*</label>
                <select name="review" id="review" required>
                    <option value="" disabled selected> Select a Product</option>
                </select>


                <div>
                    <div class="rating required">Overall Rating*</div>
                    <div class="stars">
                        <label for="one-star"></label><input type="radio" id="one-star" name="star" value="1" required>
                        <label for="two-star"></label><input type="radio" id="two-star" name="star" value="2" required>
                        <label for="three-star"></label><input type="radio" id="three-star" name="star" value="3" required>
                        <label for="four-star"></label><input type="radio" id="four-star" name="star" value="4" required>
                        <label for="five-star"></label><input type="radio" id="five-star" name="star" value="5" required>


                    </div>
                </div>



                <label for="dated" class="required"> Date of intallation*</label>
                <input type="date" id="dated" name="dated" required>

                <div>
                    <div> Which features did you find useful in the product?</div>
                    <div class="check">Check all that apply</div>
                </div>
                <label for="durability"><input type="checkbox" name="durability" id="durability" value="yes">
                    Durability</label>
                <label for="ease-of-use"><input type="checkbox" name="ease of Use" id="ease-of-use" value="yes"> Ease of
                    Use</label>
                <label for="performance"><input type="checkbox" name="performance" id="performance" value="yes">
                    Performance</label>
                <label for="design"><input type="checkbox" name="design" id="design" value="yes"> Design</label>


                <label for="written">Written Review <span class="optional">(optional)</span> </label>

                <textarea name="written" id="written" rows="5" cols="30"
                    placeholder="Type your written review here..."></textarea>

                <label for="name">Your Name <span class="optional">(optional)</span></label>
                <input type="text" name="name" id="name">
            </fieldset>
            <fieldset><input type="submit" value="Post Review"></fieldset>
        </form>
    </main>
    <footer>
        <p>☘️© <span id="currentyear"></span> Juliette Phemba DR Congo☘️</p>
        <p id="lastmodified"> Last modification</p>
    </footer>

</body>

</html>
